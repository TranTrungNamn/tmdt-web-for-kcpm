name: Demo TechVie Postman CI Automation

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/postman-automation.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  postman-test:
    name: Run Postman API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      - name: Execute Postman Collection via Newman
        env:
          POSTMAN_ACCESS_KEY: ${{ secrets.POSTMAN_ACCESS_KEY }}
        run: |
          npx newman run "https://api.postman.com/collections/57074251-3603f990-540f-4300-ad11-73843137afb6?access_key=${{ secrets.POSTMAN_ACCESS_KEY }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/TechVie_API_Report.html \
            --reporter-htmlextra-title "Demo TechVie Postman CI Test Report"

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postman-HTML-Test-Report
          path: newman-reports/TechVie_API_Report.html
          retention-days: 14
