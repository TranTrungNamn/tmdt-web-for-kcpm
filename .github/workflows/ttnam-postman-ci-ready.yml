name: TTNam - TechVie FULL - CoreAPI - BVA - EP - DT - ST (CI)

on:
  workflow_dispatch: # Chạy thủ công khi bấm "Run workflow" trên GitHub

jobs:
  run-ttnam-full-collection:
    name: TTNam FULL CoreAPI - BVA - EP - DT - ST
    runs-on: ubuntu-latest
    environment: "Testing Env"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      # Đánh thức (Warm up) Backend trên Render trước khi test để tránh timeout / cold start
      - name: Warm up & Wait for Render Backend and DB Ready
        run: |
          echo "Checking and waking up Render Backend..."
          BASE_URL="${{ secrets.RENDER_BACKEND_URL_LINK }}"
          BASE_URL="${BASE_URL%/}"

          MAX_RETRIES=30
          COUNT=0

          until [ $COUNT -ge $MAX_RETRIES ]
          do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/test-db" || true)
            echo "Ping $BASE_URL/test-db -> HTTP $HTTP_CODE (Attempt $((COUNT+1))/$MAX_RETRIES)"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Render Backend and Database are awake, healthy, and ready!"
              exit 0
            fi
            
            COUNT=$((COUNT+1))
            sleep 5
          done

          echo "Render backend failed to wake up in time ($((MAX_RETRIES*5))s)."
          exit 1

      # Chạy Collection FULL của TTNam (BVA, EP, DT, ST)
      - name: Run TTNam FULL CoreAPI - BVA - EP - DT - ST Collection
        run: |
          sleep 5
          npx newman run "postman_collections/TTNam/TTNam - TechVie FULL - CoreAPI - BVA - EP - DT - ST.postman_collection.json" \
            --delay-request 300 \
            --timeout-request 30000 \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/TTNam_FULL_CoreAPI_BVA_EP_DT_ST_Report.html \
            --reporter-htmlextra-title "TTNam - TechVie FULL - CoreAPI - BVA - EP - DT - ST Report"

      # Upload Artifact báo cáo kiểm thử HTML
      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTNam-FULL-CoreAPI-BVA-EP-DT-ST-Reports
          path: newman-reports/
          retention-days: 14
