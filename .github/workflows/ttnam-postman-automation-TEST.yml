name: TTNam Postman Automation TEST

on:
  workflow_dispatch: # Chỉ chạy khi bạn bấm nút "Run workflow" trên GitHub

jobs:
  run-postman-tests:
    name: Execute TTNam Postman Automation Collections
    runs-on: ubuntu-latest
    environment: "Testing Env"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      # 1. Chạy Collection 1: CI Ready (Core API w BVA Tests qua file local)
      - name: Run CI Ready Collection
        run: |
          npx newman run "postman_collections/Core_API_CI.postman_collection.json" \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/TTNam_Core_API_Report.html \
            --reporter-htmlextra-title "TTNam - CI Ready Core API Test Report"

      # 2. Chạy Collection 2: Cleanup Collection (Xóa & dọn dẹp dữ liệu qua file local)
      - name: Run Cleanup Collection
        if: always()
        run: |
          npx newman run "postman_collections/Cleanup_Restore.postman_collection.json" \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/TTNam_Cleanup_Report.html \
            --reporter-htmlextra-title "TTNam - Cleanup & Maintenance Report"

      # 3. Upload Test Reports Artifact
      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTNam-Postman-Test-Reports
          path: newman-reports/
          retention-days: 14
