name: MAIN 02 Old - Manual Postman BVA (A/B Testing)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/fix_TP_BVA_10

jobs:
  run-main-02-old-bva-tests:
    name: Execute MAIN 02 Old Postman BVA
    runs-on: ubuntu-latest
    environment: "Testing Env"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      - name: Warm up & Wait for Render Backend and DB Ready
        run: |
          echo "Checking and waking up Render Backend..."
          BASE_URL="${{ secrets.RENDER_BACKEND_URL_LINK }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://tmdt-web-for-kcpm-vdd4.onrender.com"
          fi
          BASE_URL="${BASE_URL%/}"

          MAX_RETRIES=30
          COUNT=0

          until [ $COUNT -ge $MAX_RETRIES ]
          do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/test-db" || true)
            echo "Ping $BASE_URL/test-db -> HTTP $HTTP_CODE (Attempt $((COUNT+1))/$MAX_RETRIES)"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Render Backend and Database are awake, healthy, and ready!"
              exit 0
            fi

            COUNT=$((COUNT+1))
            sleep 5
          done

          echo "Render backend failed to wake up in time ($((MAX_RETRIES*5))s)."
          exit 1

      # Chạy Collection từ thư mục postman_collections/MAIN 02 old
      - name: Run MAIN 02 Old Robust BVA Collection
        run: |
          sleep 5
          npx newman run "postman_collections/MAIN 02 old/TechVie - Robust BVA - Last.postman_collection.json" \
            --environment "postman_collections/MAIN 02/TechVie Render.postman_environment.json" \
            --delay-request 300 \
            --timeout-request 30000 \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK || 'https://tmdt-web-for-kcpm-vdd4.onrender.com' }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/MAIN_02_Old_Robust_BVA_Report.html \
            --reporter-htmlextra-title "MAIN 02 Old - Robust BVA Test Report (A/B)"

      # Upload Artifact báo cáo kiểm thử HTML
      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAIN-02-Old-Postman-BVA-Reports
          path: newman-reports/
          retention-days: 14
