name: MAIN - Postman Robust BVA Automation

on:
  workflow_dispatch: # Cho phép chạy thủ công khi bấm "Run workflow" trên GitHub
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "postman_collections/MAIN/**"
      - ".github/workflows/main-postman-automation.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "postman_collections/MAIN/**"
  schedule:
    - cron: "0 17 * * *" # Chạy tự động hàng ngày lúc 00:00 (GMT+7 tức 17:00 UTC)
  workflow_run:
    workflows: ["Deploy Render (CD)"]
    types:
      - completed

jobs:
  run-main-bva-tests:
    name: Execute MAIN Postman Robust BVA Automation
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment: "Testing Env"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      # Chạy Collection BVA của nhóm MAIN
      - name: Run MAIN Robust BVA Collection
        run: |
          npx newman run "postman_collections/MAIN/Automation_Robust_BVA.postman_collection.json" \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/MAIN_Robust_BVA_Report.html \
            --reporter-htmlextra-title "MAIN - Robust BVA Test Report"

      # Upload Artifact báo cáo kiểm thử HTML
      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAIN-Postman-BVA-Reports
          path: newman-reports/
          retention-days: 14
