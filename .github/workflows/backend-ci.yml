name: Backend CI

on:
  push:
    branches:
      - main
      - github-actions-test
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  APP_NAME: TechVie

jobs:
  backend:
    name: Backend - Install and Syntax Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

      - name: Run backend tests if configured
        shell: bash
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ]; then
            echo "Backend chưa khai báo script test."
          elif echo "$TEST_SCRIPT" | grep -q "no test specified"; then
            echo "Backend đang dùng script test mặc định, tạm thời bỏ qua."
          else
            npm test
          fi
