name: KCPM TechVie CI

on:
  push:
    branches:
      - github-actions-test

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  APP_NAME: TechVie

jobs:
  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend - Install and Syntax Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

      - name: Run backend tests if configured
        shell: bash
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ]; then
            echo "Backend chưa khai báo script test."
          elif echo "$TEST_SCRIPT" | grep -q "no test specified"; then
            echo "Backend đang dùng script test mặc định, tạm thời bỏ qua."
          else
            npm test
          fi
