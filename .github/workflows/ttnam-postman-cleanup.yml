name: TTNam - Postman Database Cleanup & Maintenance

on:
  workflow_dispatch: # Chạy thủ công khi bạn muốn dọn dẹp Database

jobs:
  run-ttnam-cleanup:
    name: Execute TTNam Database Cleanup & Restore
    runs-on: ubuntu-latest
    environment: "Testing Env"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create Reports Directory
        run: mkdir -p newman-reports

      # Chạy Collection Cleanup & Restore của TTNam
      - name: Run TTNam Cleanup & Restore Collection
        run: |
          npx newman run "postman_collections/TTNam/Cleanup_Restore.postman_collection.json" \
            --env-var "baseUrl=${{ secrets.RENDER_BACKEND_URL_LINK }}" \
            --env-var "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/TTNam_Cleanup_Report.html \
            --reporter-htmlextra-title "TTNam - Database Cleanup & Maintenance Report"

      # Upload Artifact báo cáo kiểm thử HTML
      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTNam-Cleanup-Reports
          path: newman-reports/
          retention-days: 14
