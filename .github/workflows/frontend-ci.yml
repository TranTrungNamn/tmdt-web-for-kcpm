name: 🎨 Frontend CI

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Kiểm tra & Build Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Tải code từ Repository
        uses: actions/checkout@v4

      - name: 🟢 Khởi tạo Node.js v20 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📥 Cài đặt thư viện Frontend
        run: npm ci || npm install

      - name: 🏗️ Đóng gói (Build) Frontend
        env:
          VITE_API_URL: https://techvie-backend.onrender.com
        run: npm run build
